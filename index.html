<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Clickable Desert Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
<style>
  body { margin: 0; padding: 0; }
  #map { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="map"></div>
<script>
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://demotiles.maplibre.org/style.json',
  center: [-116.5, 36.2], // adjust as needed
  zoom: 6
});

map.on('load', () => {
  // Add your points as a source
  map.addSource('points', {
    type: 'geojson',
    data: 'DesertLinks.geojson'
  });

  // Add the points layer
  map.addLayer({
    id: 'points-layer',
    type: 'circle',
    source: 'points',
    paint: {
      'circle-radius': 6,
      'circle-color': '#e63946',
      'circle-stroke-width': 1,
      'circle-stroke-color': '#000'
    }
  });

  // Ensure layer is interactive
  map.on('click', 'points-layer', (e) => {
    if (!e.features || !e.features.length) return;
    const feature = e.features[0].properties;
    new maplibregl.Popup()
      .setLngLat(e.lngLat)
      .setHTML(
        '<strong>' + feature.id + '</strong><br>' +
        feature.description + '<br>' +
        '<a href="' + feature.URL + '" target="_blank">Read more</a>'
      )
      .addTo(map);
  });

  // Change cursor on hover
  map.on('mouseenter', 'points-layer', () => {
    map.getCanvas().style.cursor = 'pointer';
  });
  map.on('mouseleave', 'points-layer', () => {
    map.getCanvas().style.cursor = '';
  });
});
</script>
</body>
</html>
